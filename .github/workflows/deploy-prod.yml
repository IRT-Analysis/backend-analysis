name: Flask Backend CI/CD

on:
  push:
    branches:
      - main           # Production deploy
  pull_request:
    branches:
      - main

env:
  IMAGE_TAG: latest
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/flask-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create .env.production file
        run: echo "${{ secrets.ENV_PRODUCTION }}" > .env
        
      - name: Telegram - 🔧 Build Started
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🔧 *Flask backend build started*..." \
          -d parse_mode=Markdown

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -f Dockerfile.prod -t ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} .

      - name: Push Docker Image
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Telegram - ✅ Image Pushed
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Flask image pushed to Docker Hub.*" \
          -d parse_mode=Markdown

      - name: Telegram - ❌ Build or Push Failed
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Build or push failed for Flask backend!*" \
          -d parse_mode=Markdown

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Telegram - 🚀 Deploy Started
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="🚀 *Deploying Flask backend on server...*" \
          -d parse_mode=Markdown

      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST_PRODUCTION }}
          username: ${{ secrets.USERNAME_PRODUCTION }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT_PRODUCTION }}
          script: |
            cd /home/longtr/projects
            sudo docker compose pull flask-backend
            sudo docker compose up -d flask-backend

      - name: Telegram - ✅ Deploy Success
        if: success()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="✅ *Flask backend deployed successfully!*" \
          -d parse_mode=Markdown

      - name: Telegram - ❌ Deploy Failed
        if: failure()
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
          -d chat_id=${{ secrets.TELEGRAM_CHAT_ID }} \
          -d text="❌ *Deployment failed for Flask backend!*" \
          -d parse_mode=Markdown